name: Get Citation Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-scholar-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r google_scholar_crawler/requirements.txt
      - name: Fetch citation data
        id: fetch
        working-directory: google_scholar_crawler
        run: python main.py
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
      - name: Publish citation data
        if: steps.fetch.outputs.updated == 'true'
        env:
          GH_ACTOR: ${{ github.actor }}
        run: |
          git fetch origin google-scholar-stats
          git worktree add --detach "$RUNNER_TEMP/scholar-stats" FETCH_HEAD
          cp google_scholar_crawler/results/*.json "$RUNNER_TEMP/scholar-stats/"
          cd "$RUNNER_TEMP/scholar-stats"
          git config user.name "$GH_ACTOR"
          git config user.email "$GH_ACTOR@users.noreply.github.com"
          git add gs_data.json gs_data_shieldsio.json
          if git diff --cached --quiet; then
            echo "Citation data is unchanged."
            exit 0
          fi
          git commit -m "Updated Citation Data"
          git push origin HEAD:google-scholar-stats
